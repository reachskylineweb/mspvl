
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | MSPVL Polytechnic College</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="logo/logo 1.jpeg">
</head>
<body>

    <header id="header-placeholder"></header>
    <div id="popup-placeholder" class="modal-overlay"></div>

    <main>
        <!-- Hero -->
        <section class="section bg-blue rev-fade" style="padding-top: 150px; text-align: center;">
            <div class="container">
                <h1 style="color: var(--secondary-yellow);">Campus Through the Lens</h1>
                <p style="color: white; margin-top: 20px;">Capturing moments of learning, victory, and celebration.</p>
            </div>
        </section>

        <!-- Main Gallery Grid -->
        <section class="section bg-white rev-slide-up">
            <div class="container">
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;">
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/College Front View copy_3.jpg" alt="Front View" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/mspl - home page.jpg" alt="Campus View" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/infrastructure.jpg" alt="Academic Block" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/event organised.jpg" alt="Event" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/sports.jpg" alt="Sports Day" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/iv4.jpg" alt="Industrial Visit" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/toppers.jpg" alt="Academic Toppers" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/air lab.jpg" alt="Laboratory" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                    <div class="img-zoom" style="border-radius: 15px; overflow: hidden; box-shadow: var(--shadow-sm);">
                        <img src="images/parents meeting.jpg" alt="PTM Meeting" style="width: 100%; height: 250px; object-fit: cover;">
                    </div>
                </div>
            </div>
        </section>

        <!-- Video Highlights -->
        <section class="section bg-yellow rev-zoom-in">
            <div class="container text-center">
                <h2 class="section-title" style="color: var(--primary-blue);">Video Highlights</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 40px; margin-top: 50px;">
                    <div style="border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-lg);">
                        <iframe width="100%" height="315" src="https://www.youtube.com/embed/JR0DczeVbgo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                    <div style="border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-lg);">
                        <iframe width="100%" height="315" src="https://www.youtube.com/embed/ka2Raob1t80" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/main.js"></script>
</body>
</html>
