<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Admission | MSPVL Polytechnic College</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header id="mainHeader"></header>

    <section class="page-hero">
        <div class="container">
            <p class="breadcrumb">Home &rsaquo; <span>Admission</span></p>
            <h1>Pre-Book Admission</h1>
            <p>Reserve your seat for the 2024-25 academic session.</p>
        </div>
    </section>

    <section class="sec-white">
        <div class="container reveal">
            <div style="max-width: 900px; margin: 0 auto; background: var(--white); padding: 60px; border-radius: var(--radius); border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                <form class="js-success-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
                        <div><label style="display: block; font-weight: 700; margin-bottom: 10px;">Full Student Name</label><input type="text" placeholder="Enter Full Name" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; outline: none;"></div>
                        <div><label style="display: block; font-weight: 700; margin-bottom: 10px;">Father/Guardian Name</label><input type="text" placeholder="Enter Guardian Name" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; outline: none;"></div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
                        <div><label style="display: block; font-weight: 700; margin-bottom: 10px;">Course Preference</label>
                            <select required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; outline: none; background: white;">
                                <option value="">Select Specialization</option>
                                <option value="mechanical">Mechanical Engineering</option>
                                <option value="civil">Civil Engineering</option>
                                <option value="eee">EEE</option>
                                <option value="ece">ECE</option>
                                <option value="auto">Automobile Engineering</option>
                                <option value="computer">Computer Engineering</option>
                                <option value="it">Information Technology</option>
                            </select>
                        </div>
                        <div><label style="display: block; font-weight: 700; margin-bottom: 10px;">Mobile Number</label><input type="tel" placeholder="+91 XXXX XXXX XX" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; outline: none;"></div>
                    </div>
                    <div style="margin-bottom: 30px;"><label style="display: block; font-weight: 700; margin-bottom: 10px;">Full Residential Address</label><textarea rows="4" placeholder="Enter Address details" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; outline: none;"></textarea></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
                        <div><label style="display: block; font-weight: 700; margin-bottom: 10px;">Total Marks Received (10th/12th)</label><input type="text" placeholder="Total Aggregate Marks" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px; outline: none;"></div>
                        <div style="display: flex; align-items: flex-end;"><button type="submit" class="btn-apply" style="width: 100%; border: none; cursor: pointer; padding: 15px;">Submit Reservation Request</button></div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer id="mainFooter"></footer>

    <script src="assets/js/header-footer.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
